name: watch

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [ci]
    types: [completed]
  # Daily, not hourly, and no longer on every PR push: the review bot whose
  # threads this reconciles stopped reviewing on 2026-09-23 (issue #440).
  schedule:
    - cron: '17 9 * * *'

permissions:
  issues: write
  pull-requests: write
  actions: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  review-findings:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review'
    steps:
      - name: Add label on comment
        if: github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == 'devin-ai-integration[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create review-findings --description "PR has review-bot findings to address" --color FF6B6B || true
          gh pr edit "$PR_NUMBER" --add-label review-findings
      - name: Add label on review
        if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'devin-ai-integration[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create review-findings --description "PR has review-bot findings to address" --color FF6B6B || true
          gh pr edit "$PR_NUMBER" --add-label review-findings

  ci-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure'
    concurrency:
      group: watch-ci-incident
      cancel-in-progress: false
    steps:
      - name: Open or comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
          COMMIT_SHA: ${{ github.event.workflow_run.head_commit.id }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          ISSUE_TITLE="CI failing on main"
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "CI failing on main")][0].number // empty')
          BODY=$(printf "Run: %s\nCommit: %s\nMessage: %s" "$RUN_URL" "$COMMIT_SHA" "$COMMIT_MESSAGE")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

  ci-recovery:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: watch-ci-incident
      cancel-in-progress: false
    steps:
      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
        run: |
          LATEST_CONCLUSION=$(gh run list --workflow ci --branch main --event push --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$LATEST_CONCLUSION" != "success" ]; then
            exit 0
          fi
          ISSUE_TITLE="CI failing on main"
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "CI failing on main")][0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "CI recovered in run: $RUN_URL"
          fi

  reconcile-labels:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Reconcile review-findings labels
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh pr list --state open --json number --limit 100 -q '.[] | .number' | while read PR; do
            COUNT=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
              -f o="$OWNER" -f r="$REPO" -F n="$PR" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and ((.comments.nodes[0].author.login // "") | startswith("devin-ai-integration")))] | length')
            if [ "$COUNT" -ge 1 ]; then
              gh pr edit "$PR" --add-label review-findings
            else
              gh pr edit "$PR" --remove-label review-findings || true
            fi
          done
