# Release flow: every push to main updates one open release PR (version bump +
# CHANGELOG.md entry); merging that PR tags vX.Y.Z and publishes the release.
# Bump rules from the merged PR title: feat -> minor; fix/perf/revert/docs/refactor
# -> patch; breaking ('!' or BREAKING CHANGE) -> minor while 0.x, else major; other
# types -> no release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A pull_request run on the release PR never starts, because the bot opened it,
  # so the release PR had no checks (issue #440). A workflow_dispatch started with
  # GITHUB_TOKEN is allowed: run ci.yml on the release branch, and its checks
  # land on the PR's head commit.
  release-pr-ci:
    runs-on: ubicloud-standard-2
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch CI on the open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r branch sha < <(gh pr list -R "$REPO" --state open --label "autorelease: pending" --json headRefName,headRefOid --jq '.[0] // {} | "\(.headRefName // "") \(.headRefOid // "")"') || true
          if [ -z "${branch:-}" ]; then
            echo "no open release PR"
            exit 0
          fi
          # Every push to main runs this job, but the release PR's head only moves
          # when release-please rewrites it. Re-dispatching on an unchanged head
          # would cancel the run in progress (ci.yml cancels per ref), so the
          # release PR might never finish CI. Dispatch only when no run on this
          # head is queued, running or finished (cancelled does not count).
          runs=$(gh run list -R "$REPO" --workflow ci.yml --branch "$branch" --event workflow_dispatch --limit 20             --json headSha,conclusion --jq "[.[] | select(.headSha == \"$sha\" and .conclusion != \"cancelled\")] | length")
          if [ "$runs" -gt 0 ]; then
            echo "ci.yml already ran or is running on $branch at $sha"
            exit 0
          fi
          gh workflow run ci.yml -R "$REPO" --ref "$branch"
          echo "dispatched ci.yml on $branch at $sha"

  binaries:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Gate
        run: |
          go vet ./...
          go test ./...

      - name: Build release binaries
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${spec%/*}"
            GOARCH="${spec#*/}"
            name="flywheel-$TAG-$GOOS-$GOARCH"
            [ "$GOOS" = windows ] && name="$name.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$name" ./cmd/flywheel
            (cd dist && zip -q "$name.zip" "$name")
          done
          (cd dist && sha256sum *.zip > checksums.txt)

      - name: Publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.zip dist/checksums.txt --clobber