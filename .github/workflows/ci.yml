name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # PRs, pushes to main and the release PR run a 200-task scale smoke; the
  # nightly schedule and manual dispatches run the full 1,000 (issue #440).
  schedule:
    - cron: '17 9 * * *'
  # release.yml dispatches this workflow on the release-please branch, because
  # a pull_request run on a PR the bot opened never starts (issue #440).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main runs always finish: the next landing must not cancel the scale job (#440)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubicloud-standard-2, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Windows runners keep TEMP and the Go cache on C:, which is much slower
      # than the D: drive the workspace lives on. The tests are git- and
      # temp-dir-heavy, so move both before setup-go computes its cache paths
      # (issue #440).
      - name: Temp and Go cache on the fast drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path "${{ runner.temp }}" "tmp"
          $cache = Join-Path "${{ runner.temp }}" "gocache"
          New-Item -ItemType Directory -Force $tmp, $cache | Out-Null
          "TEMP=$tmp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP=$tmp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GOCACHE=$cache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # stdlib only, so there is no go.sum to key the cache on (issue #440)
          cache-dependency-path: go.mod
      # go build is covered: vet type-checks every package, test builds them,
      # and the checks job cross-compiles and installs the binary.
      - run: go vet ./...
      # Linux runs the suite under the race detector: the tests run in parallel
      # (t.Parallel), so a data race in shared package state would otherwise
      # only show as a rare flake (issue #440). -race needs cgo, which the
      # Linux runner has.
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: go test -race
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  scale:
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # stdlib only, so there is no go.sum to key the cache on (issue #440)
          cache-dependency-path: go.mod
      # PRs, pushes to main and the release PR run 200 tasks; the nightly
      # schedule and manual dispatches run 1,000.
      - name: simulated wave
        run: go test -count=1 -run 'TestScaleWave' -timeout 30m -v ./internal/flywheel/
        env:
          FLYWHEEL_SCALE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/release-please--'))) && '1000' || '200' }}
      - name: simulated loop (next, run, validate, inspect, land, watch)
        run: go test -count=1 -run 'TestScaleFactoryLoop' -timeout 50m -v ./internal/flywheel/
        env:
          FLYWHEEL_SCALE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/release-please--'))) && '1000' || '200' }}

  # One job for the quick checks: each Ubicloud job pays a runner start and is
  # billed by the started minute (issue #440). PR title first, so a bad title
  # fails fast.
  checks:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|docs|refactor|revert|chore|ci|test|style|build)(\([^)]+\))?!?: .+'
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "PR title must be a conventional commit: <type>(<scope>)!: <subject>" >&2
            echo "allowed types: feat fix perf docs refactor revert chore ci test style build" >&2
            echo "which release: feat -> minor; fix/perf/docs/refactor/revert -> patch;" >&2
            echo "'!' before the colon -> breaking (major, or minor while major is 0); others -> no release" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # stdlib only, so there is no go.sum to key the cache on (issue #440)
          cache-dependency-path: go.mod
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Cross-compile release targets
        run: |
          set -euo pipefail
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${spec%/*}"
            GOARCH="${spec#*/}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -o /dev/null ./cmd/flywheel
          done
      - name: JSON files parse
        run: |
          for f in skills/*/evals/*.json release-please-config.json .release-please-manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done
      - name: go install and run the installed binary
        run: |
          set -euo pipefail
          rm -rf "$(go env GOMODCACHE)" "$(go env GOPATH)/bin"
          go install ./cmd/flywheel
          "$(go env GOPATH)/bin/flywheel" version

  # GitHub does not link a workflow_dispatch run's checks to a pull request, so
  # the release PR (whose CI release.yml dispatches) would show no checks. Report
  # the run's overall result as a commit status on the head commit, which the PR
  # does show (issue #440).
  release-pr-status:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    needs: [test, scale, checks]
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release-please--')
    permissions:
      statuses: write
    steps:
      - name: Commit status for the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=success
          for r in $RESULTS; do
            [ "$r" = success ] || state=failure
          done
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"             -f state="$state" -f context="ci (release PR)" -f target_url="$URL"             -f description="test, scale and checks: $RESULTS"
          echo "ci (release PR): $state ($RESULTS)"
